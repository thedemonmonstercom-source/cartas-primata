<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleção Primata</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>

:root{--bg:#161618;--sf:#252528;--fg:#f4f2ee;--mut:#8f8d96;--ac:#f4566a;color-scheme:dark;background:var(--bg);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--fg);font:600 15px/1.45 Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(90% 50% at 50% 0,#2b2b2f,transparent 70%),repeating-linear-gradient(115deg,#ffffff07 0 1px,transparent 1px 9px),var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
main{max-width:460px;margin:0 auto;padding:26px 20px 40px}
h1{margin:0;font-weight:900;font-size:clamp(2.4rem,13vw,3.7rem);line-height:.92;letter-spacing:-.01em;text-transform:uppercase}
.mut{color:var(--mut);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;margin:12px 0 0}.ctr{text-align:center}
.fr{position:relative}.fr::before{content:"";position:absolute;inset:0;border:3px solid var(--fc,#f4f2ee);filter:url(#rf);pointer-events:none}
.pn{--fc:var(--ac);display:grid;place-items:center;gap:14px;padding:34px 16px 20px;margin:24px 0 20px}
.pn small{font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.ar{position:absolute;left:4px;right:4px;top:42%;display:flex;justify-content:space-between;pointer-events:none}.ar button{pointer-events:auto;padding:10px;font-size:1.8rem;color:var(--ac)}
.cs{position:relative;display:flex;width:100%;padding:28px 0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.cs::-webkit-scrollbar{display:none}
.cs::before,.cs::after{content:"";flex:0 0 16%}
.cs .pack{width:min(100%,210px)}
.pk{flex:0 0 68%;display:grid;place-items:center;scroll-snap-align:center;scroll-snap-stop:always;transform:scale(calc(1 - var(--dd,0)*.22));opacity:calc(1 - var(--dd,0)*.6)}
.pk:active{transform:scale(calc(.97 - var(--dd,0)*.22))}
.pn{padding:8px 16px 18px}
.dots{display:flex;gap:8px}.dots i{width:22px;height:4px;background:#ffffff26}.dots i.on{background:var(--ac)}
.bt{display:block;width:100%;padding:16px 20px;font-weight:900;font-size:.9rem;letter-spacing:.24em;text-transform:uppercase;color:#141414;background:var(--ac);clip-path:polygon(0 16%,2% 0,98% 8%,100% 36%,99% 88%,95% 100%,3% 92%,0 66%)}
.bt:active{filter:brightness(.9)}.bt.gh{background:#2d2d31;color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bk{padding:6px 0;font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.tt{margin:10px 0 22px;text-align:center}
.tab{display:inline-block;padding:10px 30px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#111;background:#f4f2ee;clip-path:polygon(0 14%,4% 0,96% 8%,100% 42%,98% 92%,92% 100%,3% 94%,0 64%)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}.chips button{white-space:nowrap;padding:9px 16px;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#2d2d31}.chips .on{background:var(--ac);color:#141414}
.al{padding:18px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rl button{display:flex;align-items:center;gap:16px;width:100%;padding:11px 2px;border-bottom:1px solid #ffffff14;text-align:left}
.rl span{flex:1;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.rl em{font-style:normal;color:var(--mut);font-size:.85rem}
.sq{position:relative;display:grid;place-items:center;width:42px;height:42px;font-weight:900;color:var(--rc)}.sq::before{content:"";position:absolute;inset:0;border:3px solid var(--rc);filter:url(#rf)}
/* ===== carta: a beleza cresce com a raridade ===== */
.cd{container-type:inline-size;aspect-ratio:3/4;border-radius:12px;border:3px solid var(--rc);background:#111;color:#fff;position:relative;overflow:hidden;box-shadow:0 0 calc(var(--g)*3px) var(--rc)}
.art{position:absolute;inset:0;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art>i{position:absolute;inset:0;pointer-events:none}
.art>svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 calc(var(--g)*.9px) hsl(var(--ah) 95% 65%))}
.bg{background:radial-gradient(circle at 50% 46%,hsl(var(--ah) var(--as) 40%),hsl(var(--ah) var(--as) 7%) 80%)}
.k8 .bg{background:radial-gradient(circle at 28% 22%,#ff4fd899,transparent 45%),radial-gradient(circle at 76% 62%,#33ccff88,transparent 50%),radial-gradient(circle at 50% 46%,#3b1060,#07030f 80%);animation:neb 8s ease-in-out infinite alternate}
@keyframes neb{to{filter:hue-rotate(70deg) brightness(1.25)}}
.art>.ry{inset:-50%;background:repeating-conic-gradient(hsl(var(--ah) 95% 72%/.3) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 60%);mask-image:radial-gradient(circle,#000 8%,transparent 60%);animation:spin 18s linear infinite}
.art>.au{inset:0 -20% 48% -20%;background:linear-gradient(95deg,transparent,hsl(var(--ah) 95% 60%/.6),hsl(calc(var(--ah) + 70) 95% 62%/.5),transparent);filter:blur(12px);mix-blend-mode:screen;animation:au 7s ease-in-out infinite alternate}
@keyframes au{from{transform:translateX(-16%) skewY(-7deg)}to{transform:translateX(16%) skewY(7deg)}}
.art>.pt{inset:auto;bottom:-4%;width:3px;height:3px;border-radius:50%;background:hsl(var(--ah) 100% 84%);box-shadow:0 0 6px hsl(var(--ah) 100% 70%);opacity:0;animation:rise var(--d) linear infinite;animation-delay:var(--t)}
@keyframes rise{12%{opacity:1}to{bottom:100%;opacity:0}}
.gm{animation:fa2 3.2s ease-in-out infinite}@keyframes fa2{50%{transform:translateY(-3px)}}
.wg{transform-box:fill-box;animation:flap 2.8s ease-in-out infinite}.wg.l{transform-origin:100% 70%}.wg.r{transform-origin:0 70%}@keyframes flap{50%{transform:scale(.93,1.05)}}
.sp1,.sp2{transform-box:fill-box;transform-origin:center;animation:spin 11s linear infinite}.sp2{animation-duration:17s;animation-direction:reverse}
.art .tw{animation:tw 1.4s ease-in-out infinite alternate}
.rk{position:absolute;z-index:3;top:5px;left:5px;min-width:12cqw;padding:0 2.6cqw;text-align:center;border-radius:6px;background:var(--rc);color:#111;font-weight:900;font-size:10cqw;line-height:1.4}
.k6 .rk,.k7 .rk{background:linear-gradient(110deg,var(--rc),#fff,var(--rc));background-size:200% 100%;animation:shn 2.4s linear infinite}
.k8 .rk{background:linear-gradient(110deg,#f55,#fb3,#5e5,#3cf,#a5f,#f55);background-size:200% 100%;animation:shn 2.4s linear infinite}
@keyframes shn{to{background-position:-200% 0}}
.x{position:absolute;z-index:3;right:5px;top:5px;background:#000b;border-radius:6px;font-size:9cqw;font-style:normal;padding:0 6px}
.nm{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:16cqw 6px 5cqw;background:linear-gradient(transparent,#000d);text-align:center;font-weight:900;font-size:8.4cqw;letter-spacing:.08em;text-transform:uppercase}
.in{position:absolute;z-index:2;inset:4px;border:1px solid hsl(var(--ah) 85% 78%/.5);border-radius:8px;pointer-events:none}
.k6 .in,.k7 .in,.k8 .in{border-width:1.5px;animation:inp 2.4s ease-in-out infinite alternate}
@keyframes inp{to{border-color:hsl(var(--ah) 100% 90%/.95);box-shadow:inset 0 0 14px hsl(var(--ah) 95% 65%/.7)}}
.cd.img .rk,.cd.img .x,.cd.img .nm,.cd.img .in{display:none}
.sss{border-color:transparent;background:linear-gradient(#170f26,#170f26) padding-box,linear-gradient(120deg,#f55,#fb3,#5e5,#3cf,#a5f,#f55,#fb3) border-box;background-size:100% 100%,300% 100%;animation:rb 3s linear infinite alternate}
@keyframes rb{to{background-position:0 0,100% 0}}
.lock{border-color:#ffffff30;background:#1d1d20;box-shadow:none;color:#ffffff55}
.lock .art{display:grid;place-items:center}.lock .art svg{position:static;width:34%;height:auto;filter:none}
/* ===== fusão: carta aprimorada (sutil: cantos mais retos + gemas de nível) e animação ===== */
.cd[data-l]{border-radius:calc(12px - var(--l)*1.5px)}.cd[data-l] .in{border-radius:calc(8px - var(--l)*1px)}
.fz{position:absolute;z-index:3;left:6px;top:calc(8px + 14.5cqw);display:flex;flex-direction:column;gap:1.8cqw;pointer-events:none}
.fz i{width:3.6cqw;height:3.6cqw;background:var(--rc);transform:rotate(45deg);box-shadow:0 0 0 .7cqw #000a}
.cd[data-l="5"] .fz i{background:#fff;box-shadow:0 0 0 .7cqw #000a,0 0 2.4cqw var(--rc)}
#fz{position:fixed;inset:0;z-index:15;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#000e,#000f)}
#fz .fzc{grid-area:1/1;width:min(40vw,175px)}#fz .fzn{grid-area:1/1;position:relative;width:min(44vw,195px);opacity:0}
#fz .fzf{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fz .fzw{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border:4px solid var(--rc);border-radius:50%;opacity:0;pointer-events:none}
#fz .fzp{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--rc);pointer-events:none}
#ov{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 35%,hsl(var(--h,260) 50% 22%),#0b0b0d 75%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center}
#ov[hidden]{display:none}
#stage{width:100%;min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;touch-action:manipulation}
/* ===== pacote: envelope de folha metálica ===== */
.pack{position:relative;isolation:isolate;container-type:inline-size;width:min(58vw,236px,calc(50vh*.6));aspect-ratio:3/5}
.pack::before{content:"";position:absolute;inset:-12% -26%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,hsl(var(--h) 90% 60% / .55),transparent)}
.bob{position:absolute;inset:0;animation:fa 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.7s);filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.pp{position:absolute;inset:0}
.pp.full{-webkit-clip-path:var(--cf);clip-path:var(--cf)}
.pp.dn{z-index:3;-webkit-clip-path:var(--cb);clip-path:var(--cb)}
.pp.up{z-index:4;-webkit-clip-path:var(--ct);clip-path:var(--ct);transform-origin:100% 14%}
.foil{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(90% 52% at 50% 49%,hsl(var(--h) 95% 74% / .8),transparent 72%),linear-gradient(168deg,hsl(var(--h) 80% 56%),hsl(var(--h1) 72% 38%) 50%,hsl(var(--h2) 80% 24%))}
.rs{position:absolute;inset:0;opacity:.6;background:repeating-conic-gradient(from 0deg at 50% 49%,rgba(255,255,255,.3) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(ellipse 64% 36% at 50% 49%,#000 8%,transparent 100%);mask-image:radial-gradient(ellipse 64% 36% at 50% 49%,#000 8%,transparent 100%)}
.lg{position:absolute;left:0;right:0;top:16.4%;text-align:center;font:900 18cqw/1 Impact,"Arial Black","Helvetica Neue",system-ui,sans-serif;letter-spacing:.02em;color:#ffd84a;-webkit-text-stroke:1.5cqw hsl(var(--h) 75% 14%);paint-order:stroke fill;text-shadow:0 1.3cqw 0 hsl(var(--h) 75% 10%),0 2.2cqw 2.6cqw rgba(0,0,0,.5);transform:rotate(-3deg) skewX(-5deg)}
.rb{position:absolute;left:11%;right:11%;top:26.4%;height:4.6%;display:grid;place-items:center;font:800 4.3cqw/1 system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,rgba(26,18,48,.86),rgba(8,5,20,.92));border:.55cqw solid rgba(255,255,255,.92);border-radius:1.2cqw;box-shadow:0 1cqw 1.8cqw rgba(0,0,0,.45)}
.orb{position:absolute;left:50%;top:49%;width:66cqw;height:66cqw;margin:-33cqw 0 0 -33cqw;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,.12) 55%,transparent 70%)}
.em2{position:absolute;left:0;right:0;top:34%;height:30%;display:grid;place-items:center;font-size:42cqw;line-height:1;filter:drop-shadow(0 1.6cqw 1.6cqw rgba(0,0,0,.45))}
.pl{position:absolute;left:5%;right:5%;top:70%;height:10.8%;display:grid;place-items:center;-webkit-clip-path:polygon(0 50%,5% 6%,95% 6%,100% 50%,95% 94%,5% 94%);clip-path:polygon(0 50%,5% 6%,95% 6%,100% 50%,95% 94%,5% 94%);background:linear-gradient(180deg,#fff,#cdd1e2 36%,#7b7f98 52%,#eceef8 80%,#fff)}
.pl::before{content:"";position:absolute;inset:.9cqw;-webkit-clip-path:polygon(0 50%,4.5% 8%,95.5% 8%,100% 50%,95.5% 92%,4.5% 92%);clip-path:polygon(0 50%,4.5% 8%,95.5% 8%,100% 50%,95.5% 92%,4.5% 92%);background:linear-gradient(180deg,hsl(var(--h) 85% 48%),hsl(var(--h3) 85% 20%))}
.pl b{position:relative;font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:var(--fs,7cqw);line-height:1;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.5),0 0 1.6cqw hsl(var(--h) 90% 70% / .8)}
.ct{position:absolute;left:0;right:0;top:84.2%;text-align:center;font:800 3.6cqw/1 system-ui,-apple-system,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 .4cqw .9cqw rgba(0,0,0,.7)}
.gs{position:absolute;inset:0;background:radial-gradient(ellipse 24% 6% at 26% 21%,rgba(255,255,255,.6),transparent 72%),radial-gradient(ellipse 9% 16% at 91% 38%,rgba(255,255,255,.42),transparent 75%),radial-gradient(ellipse 32% 8% at 68% 76%,rgba(255,255,255,.3),transparent 72%),linear-gradient(104deg,transparent 16%,rgba(255,255,255,.22) 29%,transparent 42%,transparent 60%,rgba(255,255,255,.15) 70%,transparent 80%)}
.wk{position:absolute;inset:0;width:100%;height:100%}.wk path{fill:none;vector-effect:non-scaling-stroke;stroke-width:1;stroke-linecap:round}
.hl{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.8;background:linear-gradient(115deg,transparent 10%,rgba(255,45,154,.55) 28%,rgba(45,255,224,.5) 42%,rgba(255,233,45,.5) 54%,rgba(122,80,255,.55) 66%,transparent 86%);background-size:280% 280%;animation:holo 5s ease-in-out infinite alternate}
.cr{--d:180deg;position:absolute;left:0;right:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 .9px,rgba(30,30,50,.4) .9px 1.9px,rgba(255,255,255,.22) 1.9px 3.1px),linear-gradient(var(--d),hsl(var(--h) 24% 93%),hsl(var(--h) 22% 72%) 58%,hsl(var(--h) 26% 50%))}
.cr.t{top:0;height:4.6%;border-bottom:1px solid rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.4)}
.cr.b{--d:0deg;bottom:0;height:5.8%;border-top:1px solid rgba(0,0,0,.45);box-shadow:0 -1px 0 rgba(255,255,255,.4)}
.sh2{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.16) 8%,transparent 26%,transparent 72%,rgba(255,255,255,.1) 91%,rgba(0,0,0,.4)),linear-gradient(180deg,rgba(0,0,0,.16),transparent 12%,transparent 88%,rgba(0,0,0,.24))}
.gl{position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:gls 3.8s ease-in-out infinite}
@keyframes gls{55%,100%{transform:translateX(100%)}}
.ed{position:absolute;inset:0;opacity:0;transition:opacity .12s .06s;background:linear-gradient(90deg,#fff,#d4d7ea 30%,#fff 55%,#bfc3dc 80%,#fff)}
.pp.up .ed{-webkit-clip-path:var(--et);clip-path:var(--et)}
.pp.dn .ed{-webkit-clip-path:var(--eb);clip-path:var(--eb)}
.cds{position:absolute;left:11%;right:11%;top:8%;height:64%;z-index:1;border:.9cqw solid hsl(var(--h) 60% 70%);border-radius:2cqw;background:repeating-linear-gradient(45deg,hsl(var(--h) 50% 32%) 0 2.8cqw,hsl(var(--h) 50% 24%) 2.8cqw 5.6cqw);transform:translateY(24%)}
.lip{position:absolute;left:11%;right:11%;top:9%;height:7%;z-index:2;opacity:0;transition:opacity .15s .12s;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55) 85%)}
.ls{position:absolute;left:1%;right:1%;top:13.4%;height:1.6%;z-index:5;pointer-events:none;opacity:0;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#fff 12%,#fff 88%,transparent);box-shadow:0 0 12px 2px rgba(255,255,255,.9)}
.fx{position:absolute;inset:0;z-index:6;pointer-events:none}
.fx i{position:absolute;top:14%;width:2.8cqw;height:1.3cqw;border-radius:.4cqw;background:linear-gradient(90deg,#fff,hsl(var(--h) 70% 84%));opacity:0}
.pack.tear{animation:pull .5s ease-out both,vnh .28s ease-in .72s forwards}
.pack.tear .pp.up{animation:rip .86s linear .08s both}
.pack.tear .cds{animation:peek .6s cubic-bezier(.2,.8,.25,1) .26s both}
.pack.tear .lip{opacity:1}
.pack.tear .ed{opacity:.92}
.pack.tear .ls{animation:ls .6s ease-out .04s forwards}
.pack.tear .fx i{animation:fk .75s ease-out forwards}
@keyframes fa{50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes pull{20%{transform:translateY(4px) scale(1.04,.96) rotate(-1.2deg)}45%{transform:translateY(-3px) scale(.99,1.02) rotate(.8deg)}}
@keyframes vnh{to{opacity:0;transform:translateY(8%) scale(.9)}}
@keyframes rip{0%{transform:translate(0,0) rotate(0)}18%{transform:translate(.4%,-1.2%) rotate(4deg)}36%{transform:translate(1.2%,-3.6%) rotate(10deg)}52%{transform:translate(3%,-8%) rotate(18deg)}66%{transform:translate(6%,-20%) rotate(32deg)}80%{transform:translate(10%,-42%) rotate(52deg);opacity:.85}100%{transform:translate(15%,-84%) rotate(84deg);opacity:0}}
@keyframes peek{from{transform:translateY(24%)}to{transform:translateY(-8%)}}
@keyframes ls{0%{opacity:0;transform:scaleX(0)}20%{opacity:1}70%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
@keyframes fk{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.fl{perspective:900px;width:min(64vw,270px);animation:pin .38s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(26px) scale(.9)}}
.fi{position:relative;aspect-ratio:3/4;transition:transform .6s;transform-style:preserve-3d}
.fl.on .fi{transform:rotateY(180deg)}
.fi>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fi .front{transform:rotateY(180deg)}
.back{border-radius:14px;border:3px solid hsl(var(--h) 60% 65%);background:repeating-linear-gradient(45deg,hsl(var(--h) 50% 32%) 0 10px,hsl(var(--h) 50% 24%) 10px 20px);display:grid;place-items:center;font-size:4rem}
.bst{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle,var(--rc),transparent 60%);animation:bs .9s ease-out forwards}
@keyframes bs{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.tag{min-height:1.4em;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:460px;max-height:58vh;overflow-y:auto;align-content:start;padding:2px}.sum>div{position:relative}.sum .nm,.sum .in{display:none}.sum .rk{font-size:15cqw;top:3px;left:3px}.sum .x{font-size:15cqw;top:3px;right:3px;padding:0 4px}.sum>.nw::after{content:"NOVA";position:absolute;z-index:4;left:50%;bottom:3px;transform:translateX(-50%);background:var(--ac);color:#111;font-size:.5rem;font-weight:900;letter-spacing:.08em;padding:1px 5px}.two .bt{padding:16px 6px;letter-spacing:.16em;font-size:.82rem}.two.x2{margin-top:0}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px;width:100%;max-width:440px;padding:6px 4px}
.pg .pack{width:100%}

async function enviar(){const p=PL[CP],a=byId(g("tm")&&g("tm").value),b=byId(g("tq")&&g("tq").value);if(!a||!b||!okT(a,b))return toast("Escolha duas cartas do mesmo rank.");if(extra(a)<1||lvl(a))return toast("Você não tem mais essa repetida.");
 S.inv[a.id]--;save();const id=U.uid.slice(0,6)+Date.now().toString(36);
 try{await setDoc(doc(db,"trocas",id),{de:U.uid,dn:ME.n,para:p.id,pn:p.n,o:a.id,q:b.id,s:"p",t:Date.now()})}catch(e){S.inv[a.id]++;save();return warn("troca",e)}
 toast(`📨 Oferta enviada para <b>${esc(p.n)}</b>`);TOUT.push({id,de:U.uid,dn:ME.n,para:p.id,pn:p.n,o:a.id,q:b.id,s:"p"});bt()||render(1);jogadores()}
async function aceitar(id){const t=TIN.find(x=>x.id==id),a=byId(t&&t.o),b=byId(t&&t.q);if(!t||!a||!b)return toast("Troca inválida.");
 if(extra(b)<1||lvl(b))return toast(`Você não tem mais <b>${esc(b.n)}</b> repetida · recuse a troca.`);
 try{await updateDoc(doc(db,"trocas",id),{s:"ok"})}catch(e){return warn("troca",e)}
 S.ot=S.ot||{};S.inv[b.id]--;S.inv[a.id]=(S.inv[a.id]||0)+1;S.ot[id]=1;t.s="ok";save();toast(`🔁 Você recebeu <b>${esc(a.n)}</b>!`);bt()||render(1);jogadores()}
async function fim(id,s){const t=TIN.find(x=>x.id==id)||TOUT.find(x=>x.id==id);try{await updateDoc(doc(db,"trocas",id),{s})}catch(e){return warn("troca",e)}if(t)t.s=s;jogadores()}
function procOut(){S.ot=S.ot||{};let ch=0;for(const t of TOUT){if(S.ot[t.id])continue;if(t.s=="ok"){S.inv[t.q]=(S.inv[t.q]||0)+1;toast(`🔁 <b>${esc(t.pn)}</b> aceitou! Você recebeu <b>${cn(t.q)}</b>`)}else if(t.s=="no"||t.s=="ca"){S.inv[t.o]=(S.inv[t.o]||0)+1;t.s=="no"&&toast(`<b>${esc(t.pn)}</b> recusou · sua carta voltou`)}else continue;S.ot[t.id]=1;ch=1}if(ch){save();bt()||render(1)}}
function watchTr(){const c=collection(db,"trocas"),m=s=>s.docs.filter(d=>!d.metadata.hasPendingWrites).map(d=>({id:d.id,...d.data()}));
 onSnapshot(query(c,where("para","==",U.uid)),s=>{TIN=m(s);chip()},e=>warn("trocas",e));
 onSnapshot(query(c,where("de","==",U.uid)),s=>{TOUT=m(s);procOut();chip()},e=>warn("trocas",e))}

function login(msg){
 let o=g("cpl");if(!o){o=document.createElement("div");o.id="cpl";o.style.cssText="position:fixed;inset:0;z-index:99999;background:#0b0a12f2;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center";document.body.append(o)}
 o.innerHTML=`<div style="width:min(92vw,340px);display:grid;gap:10px"><h2 style="margin:0">🐒 Coleção Primata</h2><p style="margin:0;opacity:.75;font-size:.9rem">Entre para jogar online com seus amigos</p><button id="cg" class="bt cy">Entrar com Google</button><p style="margin:4px 0;opacity:.5;font-size:.8rem">ou com apelido e senha</p><input id="cn" class="cdi" placeholder="Apelido" autocapitalize="off" autocomplete="username"><input id="cs" class="cdi" type="password" placeholder="Senha (mín. 6 letras)" autocomplete="current-password"><div style="display:flex;gap:8px"><button id="ce" class="bt gh" style="flex:1">Entrar</button><button id="cc" class="bt gh" style="flex:1">Criar conta</button></div><p id="cm" style="color:#ff8a8a;min-height:1.2em;margin:0;font-size:.85rem">${msg||""}</p></div>`;
 const er=e=>{g("cm").textContent={"auth/invalid-credential":"Apelido ou senha incorretos","auth/email-already-in-use":"Esse apelido já existe","auth/weak-password":"Senha curta demais (mín. 6)","auth/popup-closed-by-user":"Login cancelado","auth/operation-not-allowed":"Esse tipo de login não foi ativado no Firebase","auth/unauthorized-domain":"Este endereço ainda não foi liberado no Firebase (Authentication > Configurações > Domínios autorizados)","auth/popup-blocked":"O navegador bloqueou a janela do Google. Libere pop-ups ou use apelido e senha","auth/operation-not-supported-in-this-environment":"Login com Google só funciona pelo link do jogo. Abra o link ou use apelido e senha","auth/network-request-failed":"Sem internet"}[e.code]||"Erro: "+e.code},
 em=()=>{NK=g("cn").value.trim();const n=NK.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");if(!n)g("cm").textContent="Digite um apelido";return n?n+"@colprimata.app":""};
 g("cg").onclick=()=>A.signInWithPopup(au,new A.GoogleAuthProvider()).catch(er);
 g("ce").onclick=()=>{const e=em();e&&A.signInWithEmailAndPassword(au,e,g("cs").value).catch(er)};
 g("cc").onclick=()=>{const e=em();e&&A.createUserWithEmailAndPassword(au,e,g("cs").value).catch(er)};
}
function convite(u,msg){
 let o=g("cpl");if(!o){o=document.createElement("div");o.id="cpl";o.style.cssText="position:fixed;inset:0;z-index:99999;background:#0b0a12f2;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center";document.body.append(o)}
 o.innerHTML=`<div style="width:min(92vw,340px);display:grid;gap:10px"><h2 style="margin:0">🔒 Só para amigos</h2><p style="margin:0;opacity:.75;font-size:.9rem">Digite o código de convite que o dono do jogo te passou. Só precisa fazer isso uma vez.</p><input id="cv" class="cdi" placeholder="Código de convite" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"><button id="cvb" class="bt cy">Entrar</button><button id="cvs" class="bt gh">Sair desta conta</button><p id="cm" style="color:#ff8a8a;min-height:1.2em;margin:0;font-size:.85rem">${msg||""}</p></div>`;
 g("cvs").onclick=()=>A.signOut(au).then(()=>location.reload());
 g("cvb").onclick=async()=>{const c=g("cv").value.trim();if(!c){g("cm").textContent="Digite o código";return}
  g("cm").textContent="Conferindo…";
  try{await setDoc(doc(db,"amigos",u.uid),{c})}
  catch(e){g("cm").textContent=e.code==="permission-denied"?"Código incorreto":e.code==="unavailable"?"Sem internet":"Erro: "+(e.code||e.message);return}
  start(u).catch(e=>{console.warn(e);convite(u,"Falha ao entrar: "+(e.code||e.message))})};
}
function chip(){const k=TIN.filter(t=>t.s=="p").length;g("cpchip")&&g("cpchip").remove();const c=document.createElement("button");c.id="cpchip";c.innerHTML=(ME.f?`<img src="${ME.f}" alt="">`:"👤")+esc(ME.n)+(k?` <b>🔔${k}</b>`:"");c.onclick=perfil;document.body.append(c)}
async function start(u){
 const m=g("cm");m&&(m.textContent="Entrando…");
 const id=u.uid,sw=L.cp_uid&&L.cp_uid!==id;ls("cp_uid",id); // outra conta neste aparelho: não mistura os saves
 if(sw){L.removeItem("colprimata_save");ls("cp_lt",0);ls("cp_d","")}
 let s,p;try{[s,p]=await Promise.all([getDoc(doc(db,"saves",id)),getDoc(doc(db,"perfis",id))])}catch(e){if(e.code==="permission-denied")return convite(u);throw e} // sem permissão = ainda não é amigo: pede o código
 const c=s.exists()?s.data():null;
 if(c&&c.t>(+L.cp_lt||0)){ls("colprimata_save",c.s);ls("cp_lt",c.t);ls("cp_d","");return reload()} // nuvem mais nova: baixa o save
 if(sw)return reload();
 let n=p.exists()?p.data().n:"";
 if(!n){n=(NK||prompt("Escolha seu apelido (seus amigos vão ver):",(u.displayName||"").split(" ")[0])||"Jogador").trim().slice(0,20);setDoc(doc(db,"perfis",id),{n})}
 U=u;ME.n=n;ME.f=p.exists()?p.data().f||"":"";if(L.getItem("colprimata_save")&&(!c||L.cp_d))pushSave();
 g("cpl")&&g("cpl").remove();chip();watchTr();pf();
 onSnapshot(doc(db,"conteudo","adm"),s=>{const d=s.data();if(!d){ready=1;L.cp_pa&&pa();return}lastA=d.adm;
  if(L.cp_pa)pa();else if(d.v!==+L.cp_v){ls("cp_v",d.v);if(d.adm!==L.getItem("colprimata_adm")){ls("colprimata_adm",d.adm);upd()}}
  fotos(d.f||{})},e=>{console.warn(e);if(e.code==="permission-denied")convite(u)});
}
A.onAuthStateChanged(au,u=>u?start(u).catch(e=>{console.warn(e);login("Falha ao entrar: "+(e.code||e.message))}):login());
})().catch(e=>console.warn("Online indisponível · jogando offline",e));

</script>
